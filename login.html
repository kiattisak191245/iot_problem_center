<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>เข้าสู่ระบบ </title>

    <!--<link
        rel="stylesheet"
        href="css/style.css"
    >-->
    <link rel="stylesheet" href="css/leading-company.css">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
              <a class="logo-text brand-link" href="index.html" aria-label="Support Problem home">
            <span class="brand-mark"><img src="logo.png" alt="Support Problem"></span>
        </a>
            </div>

            <h1>
               Support Problemfor Coach & Trainer

            </h1>

            <p class="subtitle">
                ศูนย์รวมปัญหาและวิธีแก้ไขระบบ IoT
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="กรอก Email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="กรอก Password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    เข้าสู่ระบบ
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="back-home">

                <a href="index.html">
                    ← กลับหน้าหลัก
                </a>

            </div>

        </div>

    </div>


    <!-- Supabase configuration -->
    <script src="js/supabase.js"></script>

    <!-- Login system -->
    <script src="js/login.js"></script>

</body>

</html>
